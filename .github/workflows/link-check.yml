name: External link check

on:
  push:
    paths:
      - "src/content/**"
      - "src/pages/**"
      - "*.md"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback --base-url https://specification.email --exclude "^https://specification[.]email" "./**/*.md" "./**/*.astro"
          fail: true
