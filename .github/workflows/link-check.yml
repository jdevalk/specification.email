name: External link check

on:
  push:
    paths:
      - "src/content/**"
      - "src/pages/**"
      - "*.md"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Changelog entries link root-relative (/spec/...). --root-dir lets lychee resolve those to local
          # files, which this external check then skips, like links to the site itself.
          args: --no-progress --exclude-loopback --root-dir ${{ github.workspace }} --base-url https://specification.email --exclude "^https://specification[.]email" --exclude "^file://" "./**/*.md" "./**/*.astro"
          fail: true
